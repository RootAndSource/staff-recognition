# S1+S2+S4+S6 组合配置（长记忆版）：记忆更难翻转、更持久
video:
  max_width: 1920
  max_height: 1080
  skip_frames: 0
  rtsp_timeout_ms: 5000

model:
  weights: "models/yolo26x.pt"
  upper_weights: "models/yolo26x.pt"
  full_weights: "models/yolo26x.pt"
  conf_thres: 0.25
  iou_thres: 0.5
  imgsz: 960
  device: ""
  min_box_size: 24
  full_interval: 3

segmentation:
  enabled: true
  merge_enabled: false
  det_weights: "models/yolo26x.pt"
  sam_weights: "models/sam2.1_l.pt"
  conf_thres: 0.25
  imgsz: 960
  max_det: 40
  min_mask_area_ratio: 0.0001
  simplify_points: 40
  device: ""

tracker:
  name: "bytetrack"
  track_buffer: 150
  track_high_thresh: 0.3
  track_low_thresh: 0.1
  new_track_thresh: 0.6
  merge_overlap_iou: 0.3
  with_reid: false
  appearance_thresh: 0.8
  reid_model: "auto"

uniform:
  mode: "rule"
  min_visible_area_ratio: 0.08
  roi_main:
    y_begin: 0.15
    y_end: 0.55
    x_begin: 0.10
    x_end: 0.90
  roi_lower:
    y_begin: 0.45
    y_end: 0.85
    x_begin: 0.10
    x_end: 0.90
  hsv_red:
    h1_begin: 0
    h1_end: 10
    h2_begin: 170
    h2_end: 180
    s_min: 70
    v_min: 70
  red_ratio_threshold: 0.08
  baseline_factor: 1.5
  connected_min_ratio: 0.05
  normalize: true
  classifier_path: "models/uniform_cls.pt"
  classifier_only: true

identity:
  uniform_pending_frames: 10
  uniform_window: 30
  uniform_confirm_frames: 60
  uniform_confirm_high: 0.9
  reverse_streak_frames: 5
  # 长记忆：穿->未穿 更难翻（200 起 + 每帧增长 0.1，封顶 600）
  uniform_reverse_base: 3
  uniform_reverse_true_base: 200
  uniform_reverse_growth: 0.1
  uniform_reverse_max: 600
  # 记忆衰减更慢，记忆更快生效
  memory_gain: 0.04
  memory_decay: 0.005
  memory_hold_threshold: 0.5
  track_ttl_frames: 300
  boundary_ttl_frames: 60
  match_distance_factor: 2.5
  appearance_corr_threshold: 0.85
  person_confirm_frames: 3
  leave_visible_ratio: 0.4

output:
  json_every_n_frames: 1
  show: false
  save_video: true
  video_codec: "mp4v"
  video_fps: 0
  profile: false

batch:
  input_dir: "data/preprocessed"
  json_dir: "outputs/json"
  mp4_dir: "outputs/mp4"
  extensions: [".mp4", ".avi", ".mov"]
  workers: 1

evaluate:
  sample_every_n_frames: 30
  sample_count: 100
  annotation_csv: "outputs/evaluate/annotations.csv"
