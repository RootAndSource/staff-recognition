# StaffRecognition - 最终配置（S1-S7 主链路）
# 离线批处理：YOLO26x + ByteTrack + SAM2.1 + 掩码工装规则 + 身份记忆

video:
  max_width: 1920          # 超过该宽度则等比降采样
  max_height: 1080         # 超过该高度则等比降采样
  skip_frames: 0           # 每处理 1 帧跳过的帧数（0=全帧）
  rtsp_timeout_ms: 5000

model:
  weights: "models/yolo26x.pt"   # S1 全身检测（COCO 预训练，不微调）
  conf_thres: 0.25
  iou_thres: 0.5
  imgsz: 960
  device: ""               # 留空自动选择（cuda 优先）；可写 "cpu" 或 "0"
  min_box_size: 24         # 检测框最小短边（像素），过滤过小噪声

segmentation:
  enabled: true
  det_weights: "models/yolo26x.pt"
  sam_weights: "models/sam2.1_l.pt"   # S2 分割（SAM2.1 large）
  conf_thres: 0.25
  imgsz: 960
  max_det: 40
  min_mask_area_ratio: 0.0001   # 过滤极小掩码（相对整图面积）
  simplify_points: 40           # 输出多边形顶点数上限
  device: ""

tracker:
  name: "bytetrack"        # S5 跟踪（ByteTrack；调参定案）
  track_buffer: 150        # 轨迹丢失缓冲帧数（5 秒 @30fps）
  track_high_thresh: 0.3
  track_low_thresh: 0.1
  new_track_thresh: 0.6    # 新轨迹确认阈值（越高越不易开新 ID）
  merge_overlap_iou: 0.3   # 同帧重复框合并阈值（防 YOLO 拆框）
  with_reid: false
  appearance_thresh: 0.8
  reid_model: "auto"

uniform:
  # S4 工装识别：掩码内工装色规则（免训练）
  min_visible_area_ratio: 0.08   # 判定"未穿"所需最小可见面积（相对检测框）
  hsv_red:
    h1_begin: 0
    h1_end: 10
    h2_begin: 170
    h2_end: 180
    s_min: 70
    v_min: 70
  red_ratio_threshold: 0.08
  connected_min_ratio: 0.05

identity:
  # S6 工装记忆：冷启动即出标签，翻转难度随状态持续时长动态增长
  uniform_pending_frames: 10
  uniform_window: 30
  uniform_confirm_frames: 60
  uniform_confirm_high: 0.9
  reverse_streak_frames: 5
  # 长记忆（定案）：穿->未穿 base=200，未穿->穿 base=3
  uniform_reverse_base: 3
  uniform_reverse_true_base: 200
  uniform_reverse_growth: 0.1
  uniform_reverse_max: 600
  memory_gain: 0.04
  memory_decay: 0.005
  memory_hold_threshold: 0.5
  track_ttl_frames: 300
  boundary_ttl_frames: 60
  match_distance_factor: 2.5
  appearance_corr_threshold: 0.85
  person_confirm_frames: 3
  leave_visible_ratio: 0.4

output:
  json_every_n_frames: 1
  show: false
  save_video: true
  video_codec: "mp4v"
  video_fps: 0
  profile: false

batch:
  input_dir: "data/preprocessed"
  json_dir: "outputs/json"
  mp4_dir: "outputs/mp4"
  extensions: [".mp4", ".avi", ".mov"]
  workers: 1

evaluate:
  sample_every_n_frames: 30
  sample_count: 100
  annotation_csv: "outputs/evaluate/annotations.csv"
