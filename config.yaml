# 任务 A 员工检测 - 全局配置
# 现场标定参数（置信度/ROI/HSV/红色占比/跟踪缓冲）统一在这里调整，不修改代码。

video:
  max_width: 1280          # 超过该宽度则等比降采样（降低输入分辨率提高实时性）
  max_height: 720          # 超过该高度则等比降采样
  skip_frames: 0           # 每处理 1 帧跳过的帧数（>0 时降低有效 FPS，节省算力）
  rtsp_timeout_ms: 5000    # RTSP 打开超时（毫秒）

model:
  weights: "models/yolo11x_finetuned.pt"  # 现场微调版（M2 完成，mAP50=0.965）
  conf_thres: 0.25         # 检测置信度阈值（11m 下坐姿目标置信度 0.3-0.9，可保持 0.25）
  iou_thres: 0.5           # NMS IoU 阈值
  imgsz: 960               # 推理输入尺寸
  device: ""               # 留空自动选择（cuda 优先）；可写 "cpu" 或 "0"
  min_box_size: 24         # 检测框最小短边（像素），过滤过小噪声

tracker:
  name: "botsort"          # BoT-SORT（运动 + ReID 外观融合关联）
  track_buffer: 150        # 轨迹丢失缓冲帧数（5 秒 @30fps）
  track_high_thresh: 0.3   # 轨迹确认阈值（坐姿目标多为 0.2-0.45，0.5 会漏掉）
  track_low_thresh: 0.1    # 低分框阈值
  new_track_thresh: 0.6    # 新轨迹确认阈值
  merge_overlap_iou: 0.3   # 同帧重复框合并阈值（趴姿“小框+大框”场景）
  with_reid: true          # 启用 ReID 外观特征参与关联（BoT-SORT 核心）
  appearance_thresh: 0.8   # ReID 外观相似度阈值（防 ID 交换）
  reid_model: "auto"       # auto=用检测器特征做 ReID（免费）；可换专用模型路径

uniform:
  roi_main:                # 主 ROI：肩胸（相对于检测框，0-1）
    y_begin: 0.15
    y_end: 0.55
    x_begin: 0.10
    x_end: 0.90
  roi_lower:               # 兜底 ROI：腹腰（斜俯视/桌子遮挡时用，任一段达标即判工装）
    y_begin: 0.45
    y_end: 0.85
    x_begin: 0.10
    x_end: 0.90
  hsv_red:                 # HSV 红色双区间（OpenCV H 范围 0-180）
    h1_begin: 0
    h1_end: 10
    h2_begin: 170
    h2_end: 180
    s_min: 70              # 现场标定（下调以适配背光/桌面反光）
    v_min: 70              # 现场标定
  red_ratio_threshold: 0.08   # 红色像素占比阈值（实测坐姿 ROI 红色占比 0.02-0.07）
  baseline_factor: 1.5        # ROI 红色占比需 >= 基线 * factor 才算工装
  connected_min_ratio: 0.05   # 最大红色连通域占 ROI 最小比例（工装成块先验）
  normalize: true          # 是否先做直方图均衡化（降低光照影响）
  classifier_path: "models/uniform_cls.pt"  # M3 分类器（启用后工装判定改用分类器概率）
  classifier_only: true    # true=只用分类器；false=分类器与 HSV 融合（OR）

identity:
  uniform_pending_frames: 10    # 观察期帧数（只积累，不输出标签）
  uniform_window: 30            # ACTIVE 滑动窗口（约 1 秒 @30fps）
  uniform_confirm_frames: 60    # 高置信态所需一致帧数（约 2 秒）
  uniform_confirm_high: 0.9     # 高置信态概率要求
  reverse_streak_frames: 5      # 标签翻转所需连续反向证据帧数（翻转惯性）
  track_ttl_frames: 300         # 画面内消失轨迹暂存时长（帧），10 秒 @30fps
  boundary_ttl_frames: 60       # 边界附近消失暂存时长（帧），2 秒；允许再进来成新 ID
  match_distance_factor: 2.5    # 位置匹配距离（框宽 * factor）
  appearance_corr_threshold: 0.85  # 外观（HSV 直方图）相关性兜底阈值
  person_confirm_frames: 3      # 新 ID 确认期（连续稳定帧数，消灭短命误检 ID）
  leave_visible_ratio: 0.4      # 检测框可见面积 < 40% 才视为走出画面（被裁切不算）

output:
  json_every_n_frames: 5   # 每 N 帧写一条结构化记录（降频避免日志量过大；1=逐帧）
  show: true               # 是否显示实时叠加画面
  save_video: false        # 是否保存输出视频
  video_codec: "mp4v"      # OpenCV 视频写入编码
  video_fps: 0             # 0 表示沿用输入帧率
  profile: false           # 打印各环节耗时（检测/跟踪/工装/输出），定位性能瓶颈

batch:
  input_dir: "data/preprocessed"   # 批量输入视频目录（001.mp4、002.mp4 ...）
  json_dir: "outputs/json"         # 批量 JSON 输出目录
  mp4_dir: "outputs/mp4"           # 批量视频输出目录
  extensions: [".mp4", ".avi", ".mov"]  # 支持的输入格式
  workers: 1                       # 批量并行进程数（每个进程独立加载模型；GPU 显存有限，建议 1-2）

evaluate:
  sample_every_n_frames: 30   # evaluate.py 抽帧间隔
  sample_count: 100           # 人工抽查帧数（验收口径 100 帧）
  annotation_csv: "outputs/evaluate/annotations.csv"
